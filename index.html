<style>
/* Concept: a battle grimoire. Dark ink page, mana aura that changes colour per program,
   rising embers on a canvas, burst on every tick, full-screen strike when a day is cleared. */
:root{
  color-scheme:dark;
  --bg:#080B14; --surface:#0F1424; --surface2:#151B30; --ink:#EEF0F8; --muted:#8C94B0; --line:#262E4A;
  --rest:#1A2038; --gold:#D8B45A;
  --m1:#FF3B30; --m2:#FFB22E; --on-m:#1A0604;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --title:'Cinzel','Times New Roman',serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-prog="strength"]{--m1:#FF3B30;--m2:#FFB22E;--on-m:#1A0604}
:root[data-prog="cardio"]{--m1:#22D3F5;--m2:#B4F4FF;--on-m:#021A20}
:root[data-prog="grip"]{--m1:#A855F7;--m2:#E3BFFF;--on-m:#12041F}
:root[data-prog="bands"]{--m1:#2FE38A;--m2:#D6FF7D;--on-m:#03170C}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-block:22px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:
    radial-gradient(900px 500px at 12% -10%, color-mix(in srgb,var(--m1) 22%,transparent), transparent 70%),
    radial-gradient(700px 420px at 100% 0%, color-mix(in srgb,var(--m2) 10%,transparent), transparent 70%);
  background-repeat:no-repeat;
  transition:background-image .6s;
  overflow-x:hidden;
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--m2);outline-offset:2px}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
h1{
  font-family:var(--title);font-weight:900;font-size:42px;line-height:1;margin:0;letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(100deg,var(--ink) 20%,var(--m2) 45%,var(--ink) 70%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sheen 6s linear infinite;
  filter:drop-shadow(0 0 14px color-mix(in srgb,var(--m1) 55%,transparent));
}
@keyframes sheen{to{background-position:-220% 0}}
#save{font-size:12px;color:var(--muted);min-height:1em;margin-top:6px}
.hstats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted);align-items:flex-end}
.hstats b{font-family:var(--display);font-size:24px;font-weight:700;color:var(--ink);margin-right:5px;font-variant-numeric:tabular-nums}
.flame{width:20px;height:24px;vertical-align:-5px;margin-right:4px;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px var(--m1))}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.94,1.1) rotate(2deg)}100%{transform:scale(1.04,.96) rotate(-1deg)}}
.rank{padding:6px 12px;border:1px solid var(--gold);border-radius:3px;color:var(--gold);font-family:var(--title);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;
  box-shadow:0 0 14px color-mix(in srgb,var(--gold) 30%,transparent) inset}
.rank small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:2px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tab{
  --tm1:var(--m1); --tm2:var(--m2);
  position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow:hidden;
  transition:transform .15s,border-color .2s,box-shadow .2s
}
.tab[data-prog="strength"]{--tm1:#FF3B30;--tm2:#FFB22E}
.tab[data-prog="cardio"]{--tm1:#22D3F5;--tm2:#B4F4FF}
.tab[data-prog="grip"]{--tm1:#A855F7;--tm2:#E3BFFF}
.tab[data-prog="bands"]{--tm1:#2FE38A;--tm2:#D6FF7D}
.tab:hover{transform:translateY(-2px)}
.tab .nm{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .pc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--rest);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--tm1),var(--tm2),var(--tm1));background-size:200% 100%;animation:flow 2.4s linear infinite;transition:width .7s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 10px var(--tm1)}
@keyframes flow{to{background-position:-200% 0}}
.tab[aria-selected="true"]{border-color:var(--tm1);box-shadow:0 0 0 1px var(--tm1),0 0 22px color-mix(in srgb,var(--tm1) 45%,transparent)}
.tab[aria-selected="true"]::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,color-mix(in srgb,var(--tm2) 25%,transparent) 50%,transparent 65%);transform:translateX(-120%);animation:glint 3.2s ease-in-out infinite;pointer-events:none}

        var plankSec = (1 + 0.1*Math.floor((d-1)/10))*60;
        return STR.map(function(e){
          return e[0]==='plank' ? mk(e[0],e[1],plankSec,'time',{label:fmtT(plankSec),u:'min'})
                                : mk(e[0],e[1],reps,'reps',{label:String(reps),u:'reps'});
        });
      },
      stepNote:function(d){ var n=3*(Math.floor((d-1)/3)+1)+1; return n<=this.days ? 'Reps go up on day '+n : 'Final target'; }
    },
    cardio:{ label:'Treadmill', days:41, unit:'min',
      items:function(d){
        var run=20+(d-1);
        return [ mk('run','Run',run,'min',{label:String(run),u:'min',sub:'9 km/h'}),
                 mk('walk','Walk',60,'min',{label:'60',u:'min',sub:'6 km/h · 5% incline'}) ];
      },
      stepNote:function(d){ return d<this.days ? 'Run adds 1 min tomorrow' : 'Final target'; }
    },
    grip:{ label:'Grip handler', days:30, unit:'reps',
      items:function(d){ return [ mk('grip','Grip handler',1000,'reps',{label:'1,000',u:'reps',sub:'Intensity 1'}) ]; },
      stepNote:function(d){ return 'Same target every day'; }
    },
    bands:{ label:'Bands', days:121, unit:'reps',
      isRest:function(d){ return d%3===0; },
      items:function(d){
        if(this.isRest(d)) return [ mk('rest','Rest day',0,'rest',{label:'Rest',u:'',sub:'Recover. Nothing scheduled.'}) ];
        var reps = 20 + Math.floor((d-1)/3)*2 + ((d-1)%3);
        var out=[];
        BAND.forEach(function(g){ g[1].forEach(function(e){ out.push(mk(e[0],e[1],reps,'reps',{label:String(reps),u:'reps',group:g[0]})); }); });
        return out;
      },
      stepNote:function(d){
        var n=d+1; if(this.isRest(n)) n++;
        if(n>this.days) return 'Final day';
        return 'Day '+n+': '+(this.isRest(n) ? 'rest' : (20+Math.floor((n-1)/3)*2+((n-1)%3))+' reps each');
      }
    }
  };
  var ORDER=['strength','cardio','grip','bands'];
  var RANKS=[[0,'Initiate'],[15,'Apprentice'],[50,'Adept'],[110,'Warden'],[200,'Vanguard'],[300,'Master'],[400,'Sage']];

  /* ---------- State ---------- */
  var S = { done:{strength:{},cardio:{},grip:{},bands:{}}, active:{} };
  var view = { prog:'strength', day:{} };
  var $ = function(id){ return document.getElementById(id); };

  function dayKeys(p,d){ return PROGRAMS[p].items(d).map(function(i){return i.key;}); }
  function checked(p,d){ return S.done[p][d] || []; }
  function dayState(p,d){ var c=checked(p,d).length, n=dayKeys(p,d).length; return c===0 ? 0 : (c>=n ? 2 : 1); }
  function currentDay(p){ for(var d=1; d<=PROGRAMS[p].days; d++){ if(dayState(p,d)!==2) return d; } return PROGRAMS[p].days+1; }
  function doneCount(p){ var n=0; for(var d=1; d<=PROGRAMS[p].days; d++) if(dayState(p,d)===2) n++; return n; }
  function totalDone(){ var t=0; ORDER.forEach(function(p){ t+=doneCount(p); }); return t; }
  function logged(p){
    var total=0, P=PROGRAMS[p];
    for(var d=1; d<=P.days; d++){
      var ck=checked(p,d); if(!ck.length) continue;
      P.items(d).forEach(function(it){ if(ck.indexOf(it.key)>-1){ if(it.unit==='reps'||it.unit==='min') total+=it.val; } });
    }
    return total;
  }
  function dateKey(dt){ var m=dt.getMonth()+1, d=dt.getDate(); return dt.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d; }
  function streak(){
    var dt=new Date(), n=0;
    if(!S.active[dateKey(dt)]) dt.setDate(dt.getDate()-1);
    while(S.active[dateKey(dt)]){ n++; dt.setDate(dt.getDate()-1); }
    return n;
  }
  function selDay(p){ var d=view.day[p]; if(d==null) return Math.min(currentDay(p), PROGRAMS[p].days); return d; }
  function rankInfo(){
    var t=totalDone(), i=0;
    for(var k=0;k<RANKS.length;k++) if(t>=RANKS[k][0]) i=k;
    var nxt=RANKS[i+1];
    return {name:RANKS[i][1], more: nxt ? (nxt[0]-t)+' days to '+nxt[1] : 'Top rank reached'};
  }

  /* ---------- Render ---------- */
  var CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  var FLAME='<svg class="flame" viewBox="0 0 20 24" aria-hidden="true"><path d="M10 1c1 4 6 6.500 6 12.500A6 6 0 0 1 4 14c0-2.500 1.300-4 2.500-5.500C7.500 11 9 11 9.500 9 9.800 6.500 9 4 10 1z" fill="var(--m1)"/><path d="M10 12c.8 2.200 3 3 3 5.200a3 3 0 0 1-6 0c0-1.700 1.500-2.400 3-5.200z" fill="var(--m2)"/></svg>';

  function renderHeader(){
    var r=rankInfo();
    $('hstats').innerHTML='<div>'+FLAME+'<b>'+streak()+'</b>day streak</div>'+
      '<div><b>'+totalDone()+'</b>days cleared</div>'+
      '<div class="rank">'+r.name+'<small>'+r.more+'</small></div>';
  }
  function renderTabs(){
    $('tabs').innerHTML = ORDER.map(function(p){
      var P=PROGRAMS[p], dn=doneCount(p), sel = p===view.prog;
      return '<button class="tab" role="tab" data-prog="'+p+'" aria-selected="'+sel+'">'+
        '<span class="nm">'+P.label+'</span>'+
        '<span class="pc">'+dn+' / '+P.days+' days</span>'+
        '<span class="bar"><i style="width:'+(100*dn/P.days).toFixed(1)+'%"></i></span></button>';
    }).join('');
  }
  function renderDay(){
    var p=view.prog, P=PROGRAMS[p], d=selDay(p), cur=currentDay(p);
    var items=P.items(d), ck=checked(p,d), st=dayState(p,d);
    var badge = st===2 ? '<span class="badge done">Cleared</span>'
              : (d===cur ? '<span class="badge cur">Today’s trial</span>'
              : (P.isRest && P.isRest(d) ? '<span class="badge rest">Rest day</span>' : '<span class="badge plain">'+(d<cur?'Skipped back':'Upcoming')+'</span>'));
    var html='<div class="daybar"><div class="daytitle">Day '+d+'<small>of '+P.days+'</small></div>'+
      '<div class="nav"><button id="prev" aria-label="Previous day"'+(d<=1?' disabled':'')+'>←</button>'+
      '<button id="next" aria-label="Next day"'+(d>=P.days?' disabled':'')+'>→</button></div></div>'+badge+'<ul class="items">';
    var lastG=null;
    items.forEach(function(it){
      if(it.group && it.group!==lastG){ html+='</ul><div class="grp">'+it.group+'</div><ul class="items">'; lastG=it.group; }
      var on = ck.indexOf(it.key)>-1;
      html+='<li><button class="it" data-key="'+it.key+'" aria-pressed="'+on+'">'+
        '<span class="chk">'+CHECK+'</span>'+
        '<span class="nm">'+it.name+(it.sub?'<span class="sub">'+it.sub+'</span>':'')+'</span>'+
        '<span class="tgt">'+it.label+(it.u?'<small>'+it.u+'</small>':'')+'</span></button></li>';
    });
    html+='</ul><div class="actions">';
    if(st!==2) html+='<button class="btn" id="all">Clear the day</button>';
    else if(d<P.days) html+='<button class="btn" id="advance">On to day '+(d+1)+'</button>';
    if(st>0) html+='<button class="btn ghost" id="clear">Reset day</button>';
    if(d!==Math.min(cur,P.days)) html+='<button class="btn ghost" id="tocur">Back to current</button>';
    html+='</div>';
    $('day').innerHTML=html;
  }
  function renderMap(){
    var p=view.prog, P=PROGRAMS[p], cur=currentDay(p), sel=selDay(p), done=doneCount(p);
    var unitLabel = p==='cardio' ? 'Minutes logged' : 'Reps logged';
    var next = cur>P.days ? 'All done' : P.stepNote(Math.min(cur,P.days));
    var html='<div class="stats">'+
      '<div class="stat"><b>'+done+'/'+P.days+'</b><span>Days cleared</span></div>'+
      '<div class="stat"><b>'+fmtN(logged(p))+'</b><span>'+unitLabel+'</span></div>'+
      '<div class="stat"><b style="font-size:19px;line-height:1.2">'+next+'</b><span>Next change</span></div></div>'+
      '<div class="maphd"><h2>Trial map</h2><div class="legend"><span><i style="background:var(--m1)"></i>Cleared</span><span><i style="background:color-mix(in srgb,var(--m1) 38%,var(--rest))"></i>Started</span><span><i style="background:var(--m2)"></i>Current</span></div></div>'+
      '<div class="grid" id="grid">';
    for(var d=1; d<=P.days; d++){
      var st=dayState(p,d), c='cell';
      if(P.isRest && P.isRest(d)) c+=' restd';
      if(st===2) c+=' done'; else if(st===1) c+=' part';
      if(d===cur) c+=' cur';
      if(d===sel) c+=' sel';
      html+='<button class="'+c+'" data-d="'+d+'" style="--i:'+d+'" aria-label="Day '+d+'">'+d+'</button>';
    }
    html+='</div>';
    $('map').innerHTML=html;
  }
  function theme(){ document.documentElement.setAttribute('data-prog',view.prog); fx.setColors(MANA[view.prog]); }
  var CIRC=502.65;
  function countTo(el,to){
    var from=el._v==null?0:el._v; el._v=to;
    if(REDUCE||from===to){ el.textContent=to; return; }
    var t0=performance.now(), dur=900;
    (function step(t){ var k=Math.min(1,(t-t0)/dur); k=1-Math.pow(1-k,3); el.textContent=Math.round(from+(to-from)*k); if(k<1) requestAnimationFrame(step); })(t0);
  }
  function updateHero(){
    var p=view.prog,P=PROGRAMS[p],d=selDay(p),items=P.items(d),n=items.length,c=checked(p,d).length,cur=currentDay(p);
    var pct=100*doneCount(p)/P.days;
    $('arc').style.strokeDashoffset=(CIRC*(1-pct/100)).toFixed(1);
    countTo($('pct'),Math.round(pct));
    $('hEyebrow').textContent=P.label+' \u00b7 day '+d+' of '+P.days;
    var rest=P.isRest&&P.isRest(d);
    $('hBig').innerHTML = rest ? 'Rest day' : '<b>'+c+'</b> / '+n+' trials';
    var sg=$('hSegs');
    if(sg.children.length!==n){ var h=''; for(var i=0;i<n;i++) h+='<i class="seg"></i>'; sg.innerHTML=h; }
    for(var j=0;j<n;j++) sg.children[j].classList.toggle('on',j<c);
    $('hNext').innerHTML = cur>P.days ? '<b>Program complete</b>' : '<b>Next change:</b> '+P.stepNote(Math.min(cur,P.days));
  }
  function renderAll(){ theme(); renderHeader(); renderTabs(); updateHero(); renderDay(); renderMap(); }
  function enter(){ var el=$('day'); el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
    var g=$('grid'); if(g){ g.classList.remove('wave'); void g.offsetWidth; g.classList.add('wave'); } }

  /* ---------- Effects: ember field + bursts on one canvas ---------- */
  var fx=(function(){
    var cv=$('fx'), ctx=cv.getContext('2d'), W=0,H=0,dpr=1, P=[], cols=MANA.strength, running=false, last=0;
    function size(){ dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    function ember(initial){
      return {x:Math.random()*W, y:initial?Math.random()*H:H+10, vx:(Math.random()-.5)*.3, vy:-(.25+Math.random()*.9),
              r:.8+Math.random()*2.2, life:0, max:300+Math.random()*400, sway:Math.random()*6.28, c:Math.random()<.5?0:1, ambient:true};
    }
    function target(){ return W<600?32:64; }
    function loop(t){
      if(!running) return;
      var dt=Math.min(40,t-last)/16.67; last=t;
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      var amb=0;
      for(var i=P.length-1;i>=0;i--){
        var p=P[i]; p.life+=dt;
        if(p.ambient){
          amb++; p.sway+=.02*dt; p.x+=(p.vx+Math.sin(p.sway)*.35)*dt; p.y+=p.vy*dt;
          if(p.y<-12||p.life>p.max){ P.splice(i,1); continue; }
          var a=Math.sin(Math.PI*Math.min(1,p.life/p.max))*.75;
          draw(p.x,p.y,p.r,cols[p.c],a);
        } else {
          p.vy+=p.g*dt; p.vx*=.985; p.x+=p.vx*dt; p.y+=p.vy*dt;
          var k=1-p.life/p.max; if(k<=0){ P.splice(i,1); continue; }
          draw(p.x,p.y,p.r*(.4+k),p.col,k);
        }
      }
      while(amb<target()){ P.push(ember(false)); amb++; }
      ctx.globalCompositeOperation='source-over';
      requestAnimationFrame(loop);
    }
    function draw(x,y,r,col,a){
      var g=ctx.createRadialGradient(x,y,0,x,y,r*5);
      g.addColorStop(0,hexA(col,a)); g.addColorStop(1,hexA(col,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*5,0,6.2832); ctx.fill();
    }
    function hexA(h,a){ var n=parseInt(h.slice(1),16); return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+Math.max(0,a).toFixed(3)+')'; }
    function start(){
      if(REDUCE||running) return;
      size(); for(var i=0;i<target();i++) P.push(ember(true));
      running=true; last=performance.now(); requestAnimationFrame(loop);
    }
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){ running=false; } else if(!REDUCE && !running){ running=true; last=performance.now(); requestAnimationFrame(loop); }
    });
    addEventListener('resize',function(){ if(!REDUCE) size(); });
    return {
      start:start,
      setColors:function(c){ cols=c; },
      burst:function(x,y,n,power){
        if(REDUCE||!running) return;
        for(var i=0;i<n;i++){
          var a=Math.random()*6.2832, s=(.8+Math.random())*(power||4);
          P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,g:.09,r:1+Math.random()*2.4,life:0,max:34+Math.random()*34,col:cols[Math.random()<.5?0:1]});
        }
      },
      rain:function(n){
        if(REDUCE||!running) return;
        for(var i=0;i<n;i++){
          P.push({x:Math.random()*W,y:H+10,vx:(Math.random()-.5)*2,vy:-(6+Math.random()*10),g:.12,r:1+Math.random()*2.6,life:0,max:70+Math.random()*50,col:cols[Math.random()<.5?0:1]});
        }
      }
    };
  })();

  var impactTimer=null;
  function strike(word,sub){
    if(REDUCE) return;
    var el=$('impact'); $('impactWord').textContent=word; $('impactSub').textContent=sub||'';
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    var w=$('wrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
    fx.burst(innerWidth/2,innerHeight/2,90,7); fx.rain(70);
    clearTimeout(impactTimer); impactTimer=setTimeout(function(){ el.classList.remove('on'); w.classList.remove('shake'); },1550);
  }

  /* ---------- Interaction ---------- */
  function setChecked(p,d,keys){
    var before=dayState(p,d), beforeRank=rankInfo().name;
    if(keys.length) S.done[p][d]=keys; else delete S.done[p][d];
    if(keys.length) S.active[dateKey(new Date())]=1;
    persist(); renderAll();
    if(before!==2 && dayState(p,d)===2){
      var P=PROGRAMS[p];
      var rk=rankInfo().name;
      if(doneCount(p)===P.days) strike('Program complete', P.label);
      else if(rk!==beforeRank) strike('Rank up', rk);
      else strike('Day cleared', P.label+' · day '+d);
    }
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t) return;
    var p=view.prog, P=PROGRAMS[p], d=selDay(p);
    if(t.dataset.prog){ view.prog=t.dataset.prog; renderAll(); enter(); return; }
    if(t.dataset.d){ view.day[p]=+t.dataset.d; renderDay(); renderMap(); enter(); return; }
    if(t.classList.contains('it')){
      var key=t.dataset.key, ck=checked(p,d).slice(), i=ck.indexOf(key), turnedOn=i===-1;
      if(!turnedOn) ck.splice(i,1); else ck.push(key);
      setChecked(p,d,ck);
      var again=document.querySelector('.it[data-key="'+key+'"]');
      if(again){
        again.focus();
        if(turnedOn){
          again.classList.add('pop');
          var r=again.querySelector('.chk').getBoundingClientRect();
          fx.burst(r.left+r.width/2, r.top+r.height/2, 26, 3.6);
        }
      }
      return;
    }
    if(t.id==='prev'){ view.day[p]=Math.max(1,d-1); renderDay(); renderMap(); enter(); }
    else if(t.id==='next'){ view.day[p]=Math.min(P.days,d+1); renderDay(); renderMap(); enter(); }
    else if(t.id==='all'){ setChecked(p,d,dayKeys(p,d)); }
    else if(t.id==='clear'){ setChecked(p,d,[]); }
    else if(t.id==='advance'){ view.day[p]=d+1; renderDay(); renderMap(); enter(); }
    else if(t.id==='tocur'){ delete view.day[p]; renderDay(); renderMap(); enter(); }
  });

  /* ---------- Persistence: db (per person) with local fallback ---------- */
  var ref=null, saveTimer=null, writing=false, dirty=false, mode='local';
  var LS='rep-ledger-v1';
  function say(t){ $('save').textContent=t; }
  function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } }
  function lsSet(v){ try{ localStorage.setItem(LS,JSON.stringify(v)); }catch(e){} }
  function adopt(data){
    if(!data) return;
    ['strength','cardio','grip','bands'].forEach(function(p){ S.done[p]=(data.done&&data.done[p])||{}; });
    S.active=data.active||{};
  }
  function persist(){
    lsSet(S);
    if(mode!=='db'){ say('Saved on this device only'); return; }
    say('Saving…'); clearTimeout(saveTimer); saveTimer=setTimeout(flush,500);
  }
  function flush(){
    if(writing){ dirty=true; return; }
    writing=true; dirty=false;
    ref.set({done:S.done,active:S.active,updatedAt:Date.now()}).then(function(){
      writing=false; if(dirty) flush(); else say('Saved');
    },function(){ writing=false; mode='local'; say('Saved on this device only'); });
  }
  function withTimeout(pr,ms){ return Promise.race([pr,new Promise(function(r){setTimeout(function(){r(null);},ms);})]); }

  adopt(lsGet()); renderAll(); fx.start();
  setTimeout(function(){ var g=$('grid'); if(g) g.classList.add('wave'); },0);
  if(!REDUCE){
    var core=$('core'), raf=0, px=0, py=0;
    addEventListener('pointermove',function(e){
      px=e.clientX; py=e.clientY;
      if(raf) return;
      raf=requestAnimationFrame(function(){
        raf=0; var st=document.documentElement.style;
        st.setProperty('--mx',px+'px'); st.setProperty('--my',py+'px');
        var b=core.getBoundingClientRect();
        var dx=(px-(b.left+b.width/2))/innerWidth, dy=(py-(b.top+b.height/2))/innerHeight;
        st.setProperty('--ry',(dx*34).toFixed(1)+'deg'); st.setProperty('--rx',(-dy*34).toFixed(1)+'deg');
      });
    });
  }

  (async function(){
    try{
      var c=window.claude; if(!c||!c.use) return;
      var user=await withTimeout(c.use('user'),10000);
      var db=await withTimeout(c.use('db'),10000);
      var uid = user ? await user.id() : null;
      if(!db||!uid) return;
      ref=db.collection('data/users/'+uid).doc('workout');
      var snap=await withTimeout(ref.get(),10000);
      mode='db';
      if(snap&&snap.exists){ adopt(snap.data()); say('Synced'); }
      else if(ORDER.some(function(p){ return Object.keys(S.done[p]).length; })){ flush(); }
      renderAll();
    }catch(e){ mode='local'; }
  })();
})();
</script>
